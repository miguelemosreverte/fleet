name: Deploy to GitHub Pages

on:
  push:
    branches: ["docs/validation-and-journey"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create site directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp JOURNEY.html _site/
          cp THE_WORKSHOP.html _site/
          cp VALIDATION_REPORT.html _site/
          cp VALIDATION_REPORT.md _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
